<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monopo Noise Background</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.PlaneGeometry(2, 2);

const uniforms = {
  u_time: { value: 0 },
  u_mouse: { value: new THREE.Vector2(0.5, 0.5) }
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 v_uv;
    void main() {
      v_uv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float u_time;
    uniform vec2 u_mouse;
    varying vec2 v_uv;

    // ================================
    // Classic Perlin 2D Noise
    // ================================

    vec2 fade(vec2 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}

    float cnoise21(vec2 P){
      vec4 Pi = floor(P.xyxy) + vec4(0.0, 0.0, 1.0, 1.0);
      vec4 Pf = fract(P.xyxy) - vec4(0.0, 0.0, 1.0, 1.0);
      Pi = mod(Pi, 289.0);
      vec4 ix = Pi.xzxz;
      vec4 iy = Pi.yyww;
      vec4 fx = Pf.xzxz;
      vec4 fy = Pf.yyww;
      vec4 i = permute(permute(ix) + iy);
      vec4 gx = 2.0 * fract(i * 0.0243902439) - 1.0;
      vec4 gy = abs(gx) - 0.5;
      vec4 tx = floor(gx + 0.5);
      gx = gx - tx;
      vec2 g00 = vec2(gx.x,gy.x);
      vec2 g10 = vec2(gx.y,gy.y);
      vec2 g01 = vec2(gx.z,gy.z);
      vec2 g11 = vec2(gx.w,gy.w);
      vec4 norm = 1.79284291400159 - 0.85373472095314 *
      vec4(dot(g00, g00), dot(g01, g01), dot(g10, g10), dot(g11, g11));
      g00 *= norm.x;
      g01 *= norm.y;
      g10 *= norm.z;
      g11 *= norm.w;
      float n00 = dot(g00, vec2(fx.x, fy.x));
      float n10 = dot(g10, vec2(fx.y, fy.y));
      float n01 = dot(g01, vec2(fx.z, fy.z));
      float n11 = dot(g11, vec2(fx.w, fy.w));
      vec2 fade_xy = fade(Pf.xy);
      vec2 n_x = mix(vec2(n00, n01), vec2(n10, n11), fade_xy.x);
      float n_xy = mix(n_x.x, n_x.y, fade_xy.y);
      return 2.3 * n_xy;
    }

    float random(vec2 p) {
      vec2 k1 = vec2(23.1406926, 2.66514414);
      return fract(cos(dot(p, k1)) * 12345.6789);
    }

    const vec3 black = vec3(0.0);
    const vec3 color1 = vec3(0.89, 0.34, 0.11);
    const vec3 color2 = vec3(0.56, 0.64, 0.64);
    const vec3 color3 = vec3(0.16, 0.26, 0.47);

    void main() {

      vec2 seed = v_uv * 1.5 *
        (u_mouse + 0.3 * (length(u_mouse) + 0.5));

      float n = cnoise21(seed)
        + length(u_mouse) * 0.9;

      float ml = pow(length(u_mouse), 2.5) * 0.15;

      float n1 = smoothstep(0.0, 0.2, n);
      vec3 color = mix(black, color1, n1);
      
      float n2 = smoothstep(0.1 + ml, 0.3 + ml, n);
      color = mix(color, color2, n2);

      float n3 = smoothstep(0.2 + ml, 0.4 + ml, n);
      color = mix(color, color3, n3);

      float n4 = smoothstep(0.3 + ml, 0.5 + ml, n);
      color = mix(color, black, n4);

      vec2 uvrandom = v_uv;
      uvrandom.y *= random(vec2(uvrandom.y, 0.4));
      color.rgb += random(uvrandom) * 0.05;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const target = new THREE.Vector2(0.5, 0.5);

window.addEventListener("mousemove", (e) => {
  target.set(
    e.clientX / window.innerWidth,
    1.0 - e.clientY / window.innerHeight
  );
});

function animate() {
  requestAnimationFrame(animate);

  uniforms.u_time.value += 0.005;
  uniforms.u_mouse.value.lerp(target, 0.2);

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
