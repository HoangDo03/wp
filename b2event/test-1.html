<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2EVENT - Premium Ruler Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff5f00;
            --bg-black: #050505;
            --line-color: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-black); color: white; font-family: 'Inter', sans-serif; overflow: hidden; }

        .app-container { display: flex; height: 100vh; width: 100vw; }

        /* SIDEBAR RULER */
        
        /* NỘI DUNG CUỘN */
        .content-scroll-box {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .content-scroll-box::-webkit-scrollbar { display: none; }

        section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 6vw;
            scroll-snap-align: start;
            opacity: 0.1;
            transition: opacity 0.8s ease, transform 0.8s ease;
            transform: translateX(-20px);
        }

        section.visible { opacity: 1; transform: translateX(0); }

        .title { font-size: clamp(40px, 8vw, 100px); font-weight: 900; letter-spacing: -2px; line-height: 0.9; text-transform: uppercase; }
        .label { color: var(--primary-orange); font-size: 14px; font-weight: 700; margin-bottom: 15px; display: block; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="ruler-sidebar">
            <div class="ruler-track" id="ruler-track">
                <div class="indicator" id="indicator"></div>
                </div>
        </aside>

        <main class="content-scroll-box" id="main-scroll">
            <section class="visible">
                <div>
                    <span class="label">/ 01 / WORK</span>
                    <h2 class="title">NKORA COFFEE<br>BRAND IDENTITY</h2>
                </div>
            </section>
            <section>
                <div>
                    <span class="label">/ 02 / CLIENTS</span>
                    <h2 class="title">GLOBAL<br>PARTNERS</h2>
                </div>
            </section>
            <section>
                <div>
                    <span class="label">/ 03 / ABOUT</span>
                    <h2 class="title">WE CREATE<br>EXPERIENCES</h2>
                </div>
            </section>
            <section>
                <div>
                    <span class="label">/ 04 / CONTACT</span>
                    <h2 class="title">LET'S BUILD<br>TOGETHER</h2>
                </div>
            </section>
        </main>
    </div>

    <script>
        const track = document.getElementById('ruler-track');
        const indicator = document.getElementById('indicator');
        const scroller = document.getElementById('main-scroll');
        const sections = document.querySelectorAll('section');
        
        const TOTAL_TICKS = 40; // Số lượng vạch li ti trên thước

        // 1. Tạo các vạch nhỏ
        function initRuler() {
            for (let i = 0; i < TOTAL_TICKS; i++) {
                const tick = document.createElement('div');
                tick.className = 'tick';
                track.appendChild(tick);
            }
        }

        // 2. Logic đồng bộ cuộn
        scroller.addEventListener('scroll', () => {
            const scrollTop = scroller.scrollTop;
            const scrollHeight = scroller.scrollHeight - scroller.clientHeight;
            const percent = scrollTop / scrollHeight;

            // Di chuyển mũi tên theo phần trăm cuộn
            const trackHeight = track.offsetHeight;
            // -10 để mũi tên không bị lệch ra ngoài ở điểm cuối
            indicator.style.top = (percent * (trackHeight - 10)) + 'px';

            // Xác định vạch nào gần mũi tên nhất để active
            const activeTickIndex = Math.round(percent * (TOTAL_TICKS - 1));
            const allTicks = document.querySelectorAll('.tick');
            
            allTicks.forEach((t, i) => {
                if (i === activeTickIndex) t.classList.add('active');
                else t.classList.remove('active');
            });

            // Hiệu ứng hiện nội dung
            sections.forEach(sec => {
                const rect = sec.getBoundingClientRect();
                if (rect.top >= -window.innerHeight/2 && rect.top <= window.innerHeight/2) {
                    sec.classList.add('visible');
                } else {
                    sec.classList.remove('visible');
                }
            });
        });

        initRuler();
    </script>
</body>
</html>
